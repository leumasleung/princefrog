<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>職場生存能力極限測驗 & 專屬員工證生成器</title>
    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入 html2canvas 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 { color: var(--primary-color); margin-bottom: 5px; }
        header p { color: #7f8c8d; font-size: 14px; }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1250px;
            margin: 0 auto;
            justify-content: center;
        }

        /* 問卷區塊 */
        .quiz-panel {
            flex: 2;
            min-width: 320px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .user-info-box {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #e9ecef;
        }

        .input-group { flex: 1; }
        .input-group label {
            display: block; font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #555;
        }
        .input-group input {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px;
        }

        .question-card {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f1f1f1;
        }

        .question-title {
            font-weight: bold; font-size: 15px; margin-bottom: 10px; color: var(--primary-color);
        }

        .options-group {
            display: flex; flex-direction: column; gap: 8px;
        }

        .option-label {
            display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; padding: 6px 10px; border-radius: 6px; transition: background 0.2s;
        }
        .option-label:hover { background: #f1f8ff; }

        .submit-btn {
            display: block; width: 100%; padding: 15px; background: var(--accent-color); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 20px; box-shadow: 0 4px 10px rgba(52,152,219,0.3);
        }
        .submit-btn:hover { background: #2980b9; }

        /* 預覽與員工證區塊 */
        .preview-panel {
            flex: 1; min-width: 300px; display: flex; flex-direction: column; align-items: center; gap: 20px;
        }

        .preview-title { font-weight: bold; color: var(--primary-color); margin-bottom: -10px; }

        /* 員工證卡片樣式 */
        .id-badge {
            width: 320px; height: 520px; background: #fff; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; border: 1px solid #e1e8ed; background: linear-gradient(135deg, #ffffff 0%, #fcfcfc 100%);
        }

        .id-badge::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 75px; background: linear-gradient(135deg, var(--primary-color) 0%, #34495e 100%); border-bottom-left-radius: 40% 15px; border-bottom-right-radius: 40% 15px;
        }

        .badge-header { position: relative; z-index: 10; color: white; margin-top: 12px; text-align: center; }
        .badge-header .comp-name { font-size: 9px; letter-spacing: 2px; opacity: 0.8; text-transform: uppercase; }
        .badge-header .title { font-size: 16px; font-weight: bold; margin-top: 2px; }

        .badge-avatar {
            margin-top: 20px; position: relative; z-index: 10; width: 80px; height: 80px; border-radius: 50%; background: #fff; border: 4px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; font-size: 32px; color: #bdc3c7;
        }

        .badge-info { margin-top: 10px; text-align: center; }
        .badge-name { font-size: 20px; font-weight: bold; color: var(--primary-color); }
        .badge-dept { font-size: 12px; color: #7f8c8d; margin-top: 2px; }

        .badge-chart-container {
            width: 90%; height: 200px; margin-top: 10px; display: flex; justify-content: center; align-items: center;
        }

        .badge-footer {
            width: 100%; background: #f8f9fa; padding: 8px 0; text-align: center; border-top: 1px solid #eee; font-size: 9px; color: #95a5a6;
        }

        .save-btn {
            display: none; width: 100%; padding: 12px; background: var(--success-color); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.3s;
        }
        .save-btn:hover { background: #219150; }
    </style>
</head>
<body>

<header>
    <h1>💼 職場生存能力極限測驗</h1>
    <p>回答以下 20 條血淋淋的職場靈魂拷問，解鎖你的專屬辦公室能力值與證照！</p>
</header>

<div class="main-container">
    <!-- 20題測驗面板 -->
    <div class="quiz-panel">
        <div class="user-info-box">
            <div class="input-group">
                <label for="userName">員工姓名</label>
                <input type="text" id="userName" placeholder="請輸入大名" value="社畜小王">
            </div>
            <div class="input-group">
                <label for="userDept">所屬部門</label>
                <input type="text" id="userDept" placeholder="例如：摸魚部" value="專案混分組">
            </div>
        </div>

        <div id="questionsContainer">
            <!-- 20題由 JavaScript 動態生成 -->
        </div>

        <button class="submit-btn" id="submitQuizBtn">✨ 計算評分並生成員工證</button>
    </div>

    <!-- 員工證預覽面板 -->
    <div class="preview-panel">
        <div class="preview-title">專屬能力員工證預覽</div>
        
        <!-- 員工證卡片 DOM -->
        <div id="idBadgeCard" class="id-badge">
            <div class="badge-header">
                <div class="comp-name">OFFICE SURVIVAL BADGE</div>
                <div class="title">黃金社畜認證卡</div>
            </div>

            <div class="badge-avatar">
                &#128104;&#8205;&#128187;
            </div>

            <div class="badge-info">
                <div id="badgeName" class="badge-name">社畜小王</div>
                <div id="badgeDept" class="badge-dept">專案混分組</div>
            </div>

            <div class="badge-chart-container">
                <canvas id="badgeRadarChart"></canvas>
            </div>

            <div class="badge-footer">
                ID: BOSS-9487-PRO | 有效期：直到想離職為止
            </div>
        </div>

        <button class="save-btn" id="saveBadgeBtn">💾 下載員工證圖片 (PNG)</button>
    </div>
</div>

<script>
    const categories = ['溝通協調', '問題解決', '時間管理', '團隊合作', '抗壓能力'];

    const questionsData = [
        // --- 1. 溝通協調 (0) ---
        {

                { t: "會議中不斷點頭微笑，會後偷偷問聽得懂的同事", score: 4 },
                { t: "在底下偷偷開 AI 即時語音字幕試圖救自己", score: 3 },
                { t: "放棄掙扎，直接閉上眼睛假裝深思", score: 1 }
            ]
        },
        {
            cat: 0, text: "2. 同事和你跟进項目，但他口臭非常嚴重，你會？",
            options: [
                { t: "微笑遞上一粒口香糖：「這超好吃，你要不要來一粒？」", score: 5 },
                { t: "忍氣吞聲，慢慢退後兩步保持社交距離", score: 3 },
                { t: "立刻戴上 N95 口罩，假裝自己感冒咳嗽", score: 2 },
                { t: "當場捏住鼻子，大喊：「你剛剛是吃了大便嗎？！」", score: 1 }
            ]
        },
        {
            cat: 0, text: "3. 上司說今年 Team Building 要去野外定向，大家覺得超熱超辛苦又沒人敢作聲，你會？",
            options: [
                { t: "私下收集大家意見，提出「室內密室逃脫」等替代方案向主管優雅建議", score: 5 },
                { t: "在私下 WhatsApp 群組瘋狂吐槽，但會議上一言不發", score: 3 },
                { t: "活動當天早上打電話請病假", score: 2 },
                { t: "當場直接翻白眼：「去野外？要去你自己去！」", score: 1 }
            ]
        },
        {
            cat: 0, text: "4. 開會時客戶對著你的 Proposal 大發雷霆，但明明是他上次自己要求的，你會？",
            options: [
                { t: "冷靜拿出上次會議紀錄，委婉地幫客戶記憶復甦", score: 5 },
                { t: "先道道歉包攬責任，回去再默默修改", score: 4 },
                { t: "低頭瘋狂畫畫，假裝自己在認真記筆記", score: 2 },
                { t: "當場拍桌：「你自己上次親口講的，要不要聽錄音？！」", score: 1 }
            ]
        },

        // --- 2. 問題解決 (1) ---
        {
            cat: 1, text: "5. 大老闆要求項目 1 個月內完成，但明明一定要 3 個月才做好，你會？",
            options: [
                { t: "拆解 MVP（最小可行性產品），拿數據告訴老闆 1 個月能先交出哪些重點", score: 5 },
                { t: "先一口答應下來，最後一週再向老闆哭訴人手不足求延期", score: 3 },
                { t: "拉著全組人每天加班到凌晨 2 點狂幹", score: 2 },
                { t: "當場遞出辭呈：「既然這樣，那你找神仙來做吧。」", score: 1 }
            ]
        },
        {
            cat: 1, text: "6. 正要 Present 給客戶前 5 分鐘，PPT 檔案突然損毀開啟不了，你會？",
            options: [
                { t: "完全不慌，憑記憶直接開白板或拿實體樣品口頭生動演示", score: 5 },
                { t: "火速找雲端自動備份或歷史版本救救援", score: 4 },
                { t: "滿頭大汗向客戶道歉，延後會議", score: 2 },
                { t: "假裝肚子劇痛衝進廁所躲起來", score: 1 }
            ]
        },
        {
            cat: 1, text: "7. 上司交付的大項目開始後，你身為 PM 才發現 Vendor 不是你選的且名不副實：技術差、經驗不足還錯過 critical milestone，你會？",
            options: [
                { t: "立即整理 Risk Assessment 與事證，帶着 mitigation plan 向老闆開誠布公應對", score: 5 },
                { t: "啟動 SLA 條款懲罰 Vendor，並派團隊內強者進駐硬帶他們過關", score: 4 },
                { t: "私下天天發郵件幹譙 Vendor，把紀錄存好準備日後開會甩鍋", score: 2 },
                { t: "攤手擺爛：「當初又不是我選的，爛掉也是理所當然。」", score: 1 }
            ]
        },
        {
            cat: 1, text: "8. 隔壁組小黃上次才跟你爆料過大八卦，昨天主管私下透露小黃其實被 Fire 掉了（但要求保密）。現在小黃湊過來緊張地問：「聽說公司炒人名單 Confirm 了，你有沒有內幕消息？」你會？",
            options: [
                { t: "演技大爆發，展現極致影帝級關懷：「啥？！我完全沒聽說欸，但最近風頭緊，要不要我幫你看看履歷？」", score: 5 },
                { t: "瞬間尿急：「哎呀我肚子痛爆要上廁所！」然後一溜煙拔腿就跑", score: 4 },
                { t: "眼神飄忽不敢直視小黃，支支吾吾半天說出「額...這個嘛...不好說」讓全場氣氛凝結", score: 2 },
                { t: "藏不住秘密，忍不住脫口而出：「兄弟...其實名單上就是你，保重！」", score: 1 }
            ]
        },

        // --- 3. 時間管理 (2) ---
        {
            cat: 2, text: "9. 早上鬧鐘響了，你通常會按幾次「 snooze (貪睡)」按鈕？",
            options: [
                { t: "鬧鐘響前 1 分鐘自然醒，從容起身做早餐", score: 5 },
                { t: "按 1 次，極限計算梳洗時間並準時出門", score: 4 },
                { t: "按了 10 次，最後以狂奔姿態壓線打卡", score: 2 },
                { t: "按到醒來發現已經中午，順便請半天假", score: 1 }
            ]
        },
        {
            cat: 2, text: "10. 下班前 5 分鐘，主管突然遞給你一個「明天一早要用」的緊急文件，你會？",
            options: [
                { t: "花 10 分鐘評估核心關鍵，高效做完再快樂下班", score: 5 },
                { t: "認命留下來加班到八點做完", score: 4 },
                { t: "帶回家放在床頭，結果整晚做噩夢沒做", score: 2 },
                { t: "裝作沒看見，背起背包以閃電的速度衝出門", score: 1 }
            ]
        },
        {
            cat: 2, text: "11. 面對堆積如山的待辦事項（To-Do List），你的處理順序是？",
            options: [
                { t: "使用「艾森豪矩陣」先做重要且緊急的事", score: 5 },
                { t: "從最簡單、最順手的事情開始做", score: 4 },
                { t: "先把「滑手機、喝咖啡」寫進 List 再劃掉找成就感", score: 2 },
                { t: "盯著清單發呆兩小時，最後一件都沒做", score: 1 }
            ]
        },
        {
            cat: 2, text: "12. 同事邀你下午一起團購手搖飲料，但你手上有急件，你會？",
            options: [
                { t: "秒訂完成，並給自己設定「喝完這杯前要把工作做完」的計時獎勵", score: 5 },
                { t: "忍痛拒絕，專心先把工作趕完", score: 4 },
                { t: "跟著訂飲料並開始跟同事聊天 1 小時，導致加班", score: 2 },
                { t: "把同事的手搖飲打翻：「喝什麼喝！不用做事啊！」", score: 1 }
            ]
        },

        // --- 4. 團隊合作 (3) ---
        {
            cat: 3, text: "13. 團體專案中遇到了著名的「豬隊友」完全不做事，你會？",
            options: [
                { t: "明確切分作業微小化，給他指派簡單明確的任務並設置 Deadline", score: 5 },
                { t: "默默把他的份也做完，免得影響自己績效", score: 3 },
                { t: "在背後跟其他同事瘋狂抱怨他", score: 2 },
                { t: "直接在全公司的大群組標記他開罵", score: 1 }
            ]
        },
        {
            cat: 3, text: "14. 公司尾牙抽獎需要各部門派人上台表演，你會？",
            options: [
                { t: "熱情參與編舞組或後勤，幫大家爭取最佳表現", score: 5 },
                { t: "配合大家在後面當充氣背景板舞者", score: 4 },
                { t: "上台後完全僵硬，像木頭一樣站著", score: 2 },
                { t: "尾牙當天裝 sick leave（病假）逃避表演", score: 1 }
            ]
        },
        {
            cat: 3, text: "15. 訂午餐外送時大家意見分歧，有人想吃壽司有人想吃麻辣鍋，你會？",
            options: [
                { t: "找到一家同時有賣壽司與鍋物的複合式餐廳，拯救大家", score: 5 },
                { t: "採用少數服從多數，幫少數人安撫情緒", score: 4 },
                { t: "隨便啦，你們點什麼我吃什麼", score: 3 },
                { t: "因為吃不到想吃的，當場氣到自己跑去吃超商", score: 1 }
            ]
        },
        {
            cat: 3, text: "16. 隔壁組的同事因為專案爆掉在座位上默默掉眼淚，你會？",
            options: [
                { t: "遞上紙巾，並私下問有沒有自己能分擔的小忙", score: 5 },
                { t: "默默在他的桌上放一顆巧克力", score: 4 },
                { t: "裝作沒看到，繼續打自己的字", score: 2 },
                { t: "拿起手機偷拍發限時動態：「有人哭了哈哈」", score: 1 }
            ]
        },

        // --- 5. 抗壓能力 (4) ---
        {
            cat: 4, text: "17. 團隊內同事都有各自小圈子，你要一個人吃飯，大家去 Happy Hour 也不叫你，你會？",
            options: [
                { t: "超開心！一個人吃飯自由自在，下班直接享受 Me Time", score: 5 },
                { t: "做好本份，尋找公司跨部門或其他合得來的夥伴", score: 4 },
                { t: "躲在廁所隔間裡面吃三明治，邊吃邊流淚", score: 2 },
                { t: "偷偷去舉報他們在辦公室搞霸凌和小團體", score: 1 }
            ]
        },
        {
            cat: 4, text: "18. 年底績效面談，主管給了你一個超低評分還逼你承認，你會？",

                { t: "冷靜要求具體改善指標，會後立刻開始面試更新 Resume 準備跳槽", score: 5 },
                { t: "默默接受，回家抱著棉被痛哭", score: 3 },
                { t: "當場跟主管大吵一架並摔門而出", score: 2 },
                { t: "去公司 Google Map 評論狂刷 1 星負評並寫匿名信", score: 1 }
            ]
        },
        {
            cat: 4, text: "19. 辦公室冷氣故障高達 33 度，但今天有重要報告不能離場，你會？",
            options: [
                { t: "拿冰飲冰敷脈搏，並開玩笑緩和大家躁動的情緒", score: 5 },
                { t: "默默忍受，邊流汗邊把報告做完", score: 4 },
                { t: "熱到發脾氣，對旁邊的同事大吼大叫", score: 2 },
                { t: "脫到只剩內衣內褲並躺在地上擺爛", score: 1 }
            ]
        },
        {
            cat: 4, text: "20. 你辛苦做了一個月的 Project，最後成果發表時主管卻說全是他一個人的功勞，你會？",
            options: [
                { t: "在簡報頁面巧妙留有自己的名字與版本紀錄，優雅拿回主導權", score: 5 },

                { t: "忍氣吞聲，只敢在 Thread 上發匿名黑文", score: 2 },
                { t: "發表會上直接搶過麥克風：「這明明全是我做的！」", score: 1 }
            ]
        }
    ];

    // 動態渲染 20 條題目到頁面上
    const container = document.getElementById('questionsContainer');
    questionsData.forEach((q, index) => {
        let optionsHtml = '';
        q.options.forEach((opt, optIndex) => {
            const checked = optIndex === 0 ? 'checked' : '';
            optionsHtml += `
                <label class="option-label">
                    <input type="radio" name="q_${index}" value="${opt.score}" ${checked}>
                    ${opt.t}
                </label>
            `;
        });

        const card = document.createElement('div');
        card.className = 'question-card';
        card.innerHTML = `
            <div class="question-title">${q.text}</div>
            <div class="options-group">${optionsHtml}</div>
        `;
        container.appendChild(card);
    });

    let badgeChart = null;

    // 初始化雷達圖
    function initRadarChart(scores) {
        const ctx = document.getElementById('badgeRadarChart').getContext('2d');
        if (badgeChart) { badgeChart.destroy(); }

        badgeChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: categories,
                datasets: [{
                    label: '能力評分',
                    data: scores,
                    backgroundColor: 'rgba(52, 152, 219, 0.25)',
                    borderColor: 'rgba(52, 152, 219, 1)',
                    borderWidth: 2,
                    pointBackgroundColor: 'rgba(52, 152, 219, 1)',
                    pointBorderColor: '#fff',
                    pointRadius: 3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    r: {
                        angleLines: { color: 'rgba(0,0,0,0.1)' },
                        grid: { color: 'rgba(0,0,0,0.05)' },
                        suggestedMin: 1,
                        suggestedMax: 5,
                        ticks: { stepSize: 1, display: false },
                        pointLabels: {
                            font: { size: 10, weight: 'bold' },
                            color: '#2c3e50'
                        }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    // 計算分數與更新證件
    function calculateAndRender() {
        const name = document.getElementById('userName').value || "無名社畜";
        const dept = document.getElementById('userDept').value || "神祕部門";

        document.getElementById('badgeName').textContent = name;
        document.getElementById('badgeDept').textContent = dept;

        let catSums = [0, 0, 0, 0, 0];
        let catCounts = [0, 0, 0, 0, 0];

        questionsData.forEach((q, index) => {
            const selected = document.querySelector(`input[name="q_${index}"]:checked`);
            const score = selected ? parseInt(selected.value) : 3;
            catSums[q.cat] += score;
            catCounts[q.cat]++;
        });

        const finalScores = catSums.map((sum, i) => parseFloat((sum / catCounts[i]).toFixed(1)));

        initRadarChart(finalScores);
        document.getElementById('saveBadgeBtn').style.display = 'block';
    }

    // 按鈕事件
    document.getElementById('submitQuizBtn').addEventListener('click', () => {
        calculateAndRender();
        document.getElementById('idBadgeCard').scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById('saveBadgeBtn').addEventListener('click', () => {
        const cardElement = document.getElementById('idBadgeCard');
        const name = document.getElementById('badgeName').textContent;

        html2canvas(cardElement, {
            scale: 2,
            useCORS: true,
            backgroundColor: null
        }).then(canvas => {
            const image = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
            const link = document.createElement('a');
            link.download = `職場能力證書_${name}.png`;
            link.href = image;
            link.click();
        });
    });

    window.onload = () => {
        calculateAndRender();
    };
</script>

</body>
</html>
